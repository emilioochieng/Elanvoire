<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Elanvoire Admin</title>
<style>
:root{--bg:#F9F6EF;--ink:#30251F;--muted:#74685F;--line:#E3D9CC;--surface:#fff;--soft:#F1EBE2;--primary:#3A2E25;--gold:#B99A60;--bad:#a14e43;--ok:#4d6b45;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Montserrat','Avenir Next',Arial,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--primary);background:var(--primary);color:#F9F6EF;padding:10px 16px;letter-spacing:.1em;text-transform:uppercase;font-size:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.small{padding:6px 10px}.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--surface);margin-top:5px}
label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.wordmark{font-family:'Playfair Display',Georgia,serif;letter-spacing:.19em;font-size:22px}.wordmark span{color:var(--gold)}
.login{max-width:380px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 4%;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:6px}.tab{border:0;background:none;padding:8px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}.tab.on{border-color:var(--gold)}
main{padding:24px 4%;max-width:1200px;margin:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.thumb{width:44px;height:55px;object-fit:cover;background:var(--soft);display:block}
.pill{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line)}.pill.off{color:var(--bad);border-color:var(--bad)}
.order{background:var(--surface);border:1px solid var(--line);padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}
.order small{color:var(--muted)}.order ul{margin:6px 0 0;padding-left:18px}
.s-paid,.s-delivered{color:var(--ok)}.s-failed,.s-cancelled{color:var(--bad)}
dialog{border:1px solid var(--line);background:var(--bg);padding:26px;width:min(560px,94vw);max-height:92vh}dialog::backdrop{background:#17120e99}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{color:var(--bad);font-size:12px;min-height:18px}
.scroll{overflow-x:auto}.chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}.chk input{width:auto;margin:0}
@media(max-width:600px){.row2{grid-template-columns:1fr}.order{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <div class="wordmark" style="text-align:center;margin-bottom:6px">ELAN<span>V</span>OIRE</div>
  <p style="text-align:center;color:var(--muted);margin:0 0 22px">Store admin</p>
  <form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <p class="msg" id="loginMsg" role="alert"></p><button class="btn" style="width:100%">Sign in</button></form>
</section>

<div id="app" hidden>
  <header class="top"><div class="wordmark">ELAN<span>V</span>OIRE <small style="font-size:10px;letter-spacing:.2em;color:var(--muted)">ADMIN</small></div>
    <nav class="tabs"><button class="tab on" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button></nav>
    <button class="btn ghost small" id="signOut">Sign out</button></header>
  <main>
    <section id="tab-products">
      <div class="bar"><h2>Products</h2><button class="btn" id="newProduct">Add product</button></div>
      <div class="scroll"><table class="tbl"><thead><tr><th></th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="pRows"></tbody></table></div>
    </section>
    <section id="tab-orders" hidden>
      <div class="bar"><h2>Orders</h2><div><select id="statusFilter" style="width:auto;margin:0 8px 0 0"><option value="">All statuses</option></select><button class="btn ghost small" id="refreshOrders">Refresh</button></div></div>
      <div id="oRows"></div>
    </section>
  </main>
</div>

<dialog id="pDialog">
  <h3 id="pTitle" style="margin-bottom:16px">Product</h3>
  <form id="pForm">
    <label>Name<input name="name" required></label>
    <div class="row2"><label>Brand<input name="brand" list="brandList" required></label><label>Category<input name="category" list="catList" required></label></div>
    <div class="row2"><label>Price (KSh)<input name="price_kes" type="number" min="0" step="1" required></label><label>Stock<input name="stock" type="number" min="0" step="1" required></label></div>
    <label>Badge (optional, e.g. New)<input name="tag" maxlength="30"></label>
    <label>Description<textarea name="description" rows="3"></textarea></label>
    <label>Image: upload a file<input name="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <label>…or paste an image URL<input name="image_url" type="url" placeholder="https://"></label>
    <label class="chk"><input name="is_active" type="checkbox" checked> Visible in the shop</label>
    <datalist id="brandList"></datalist><datalist id="catList"></datalist>
    <p class="msg" id="pMsg" role="alert"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn ghost" id="pCancel">Cancel</button><button class="btn" id="pSave">Save</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = window.ELANVOIRE || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'KSh ' + Number(n).toLocaleString('en-KE');
const slugify = s => s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const STATUSES = ['pending', 'awaiting_payment', 'paid', 'failed', 'shipped', 'delivered', 'cancelled'];

if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Add your Supabase URL and anon key to <code>config.js</code> first.</p>';
  throw new Error('config.js is not filled in');
}
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let products = [], editing = null;

/* ---------- auth ---------- */
async function enter(session) {
  if (!session) { $('login').hidden = false; $('app').hidden = true; return }
  const { data } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if (!data?.is_admin) {
    await sb.auth.signOut(); $('login').hidden = false; $('app').hidden = true;
    $('loginMsg').textContent = 'This account is not an admin.'; return;
  }
  $('login').hidden = true; $('app').hidden = false; loadProducts(); loadLookups();
}
sb.auth.getSession().then(({ data }) => enter(data.session));
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginMsg').textContent = '';
  const f = new FormData(e.target);
  const { data, error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
  if (error) $('loginMsg').textContent = 'Sign-in failed. Check your email and password.'; else enter(data.session);
});
$('signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.reload() });

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('tab-products').hidden = t.dataset.tab !== 'products'; $('tab-orders').hidden = t.dataset.tab !== 'orders';
  if (t.dataset.tab === 'orders') loadOrders();
}));

/* ---------- products ---------- */
async function loadLookups() {
  const [b, c] = await Promise.all([sb.from('brands').select('name').order('name'), sb.from('categories').select('name').order('name')]);
  $('brandList').innerHTML = (b.data || []).map(x => `<option value="${esc(x.name)}">`).join('');
  $('catList').innerHTML = (c.data || []).map(x => `<option value="${esc(x.name)}">`).join('');
}
async function loadProducts() {
  const { data, error } = await sb.from('products').select('*, brands(name), categories(name)').order('created_at', { ascending: false });
  if (error) { $('pRows').innerHTML = `<tr><td colspan="7">Could not load products: ${esc(error.message)}</td></tr>`; return }
  products = data;
  $('pRows').innerHTML = products.map(p => `<tr><td><img class="thumb" src="${esc(p.image_url || 'images/placeholder.svg')}" alt="" onerror="this.onerror=null;this.src='images/placeholder.svg'"></td><td>${esc(p.name)} ${p.is_active ? '' : '<span class="pill off">Hidden</span>'}</td><td>${esc(p.brands?.name)}</td><td>${esc(p.categories?.name)}</td><td>${money(p.price_kes)}</td><td>${p.stock}</td><td><button class="btn ghost small" data-edit="${p.id}">Edit</button></td></tr>`).join('') || '<tr><td colspan="7">No products yet.</td></tr>';
}
function openForm(p) {
  editing = p; const f = $('pForm'); f.reset(); $('pMsg').textContent = '';
  $('pTitle').textContent = p ? 'Edit product' : 'Add product';
  if (p) {
    f.name.value = p.name; f.brand.value = p.brands?.name || ''; f.category.value = p.categories?.name || '';
    f.price_kes.value = p.price_kes; f.stock.value = p.stock; f.tag.value = p.tag || '';
    f.description.value = p.description || ''; f.image_url.value = p.image_url || ''; f.is_active.checked = p.is_active;
  }
  $('pDialog').showModal();
}
$('newProduct').addEventListener('click', () => openForm(null));
$('pCancel').addEventListener('click', () => $('pDialog').close());
$('pRows').addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) openForm(products.find(p => p.id === b.dataset.edit)) });

$('pForm').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, msg = $('pMsg'), btn = $('pSave');
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const brand = f.brand.value.trim(), category = f.category.value.trim(), name = f.name.value.trim();
    const b = await sb.from('brands').upsert({ name: brand }, { onConflict: 'name' }).select('id').single(); if (b.error) throw b.error;
    const c = await sb.from('categories').upsert({ name: category, slug: slugify(category) }, { onConflict: 'name' }).select('id').single(); if (c.error) throw c.error;
    let image_url = f.image_url.value.trim() || null;
    const file = f.file.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024) throw new Error('Image is over 5 MB. Please use a smaller file.');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = `${crypto.randomUUID()}.${ext}`;
      const up = await sb.storage.from('product-images').upload(path, file, { contentType: file.type, cacheControl: '31536000' });
      if (up.error) throw up.error;
      image_url = sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
    }
    const row = { name, brand_id: b.data.id, category_id: c.data.id, price_kes: parseInt(f.price_kes.value, 10), stock: parseInt(f.stock.value, 10),
      tag: f.tag.value.trim() || null, description: f.description.value.trim() || null, image_url, is_active: f.is_active.checked };
    const res = editing
      ? await sb.from('products').update(row).eq('id', editing.id)
      : await sb.from('products').insert({ ...row, slug: slugify(name) + '-' + Math.random().toString(36).slice(2, 6) });
    if (res.error) throw res.error;
    $('pDialog').close(); loadProducts(); loadLookups();
  } catch (err) { msg.textContent = err.message || 'Could not save.' }
  btn.disabled = false; btn.textContent = 'Save';
});

/* ---------- orders ---------- */
$('statusFilter').innerHTML += STATUSES.map(s => `<option value="${s}">${s.replace('_', ' ')}</option>`).join('');
$('statusFilter').addEventListener('change', loadOrders);
$('refreshOrders').addEventListener('click', loadOrders);
async function loadOrders() {
  let q = sb.from('orders').select('*, order_items(name, quantity, unit_price_kes)').order('created_at', { ascending: false }).limit(100);
  if ($('statusFilter').value) q = q.eq('status', $('statusFilter').value);
  const { data, error } = await q;
  if (error) { $('oRows').innerHTML = `<p>Could not load orders: ${esc(error.message)}</p>`; return }
  $('oRows').innerHTML = data.map(o => `<div class="order"><div>
      <strong>${esc(o.customer_name)}</strong> · ${esc(o.phone)}${o.email ? ' · ' + esc(o.email) : ''}<br>
      <small>${esc(o.delivery_address)}, ${esc(o.delivery_county)} · ${new Date(o.created_at).toLocaleString('en-KE')} · ref ${o.id.slice(0, 8).toUpperCase()}</small>
      <ul>${(o.order_items || []).map(i => `<li>${i.quantity} × ${esc(i.name)} (${money(i.unit_price_kes)})</li>`).join('')}</ul>
      <small>Subtotal ${money(o.subtotal_kes)} + delivery ${money(o.delivery_fee_kes)}${o.mpesa_receipt ? ' · M-Pesa ' + esc(o.mpesa_receipt) : ''}${o.payment_result_desc && o.status === 'failed' ? ' · ' + esc(o.payment_result_desc) : ''}</small></div>
      <div style="text-align:right"><strong>${money(o.total_kes)}</strong><br>
      <select data-order="${o.id}" class="s-${o.status}" style="width:auto">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''} value="${s}">${s.replace('_', ' ')}</option>`).join('')}</select></div></div>`).join('') || '<p>No orders yet.</p>';
}
$('oRows').addEventListener('change', async e => {
  const sel = e.target.closest('[data-order]'); if (!sel) return;
  const { error } = await sb.from('orders').update({ status: sel.value }).eq('id', sel.dataset.order);
  if (error) { alert('Could not update: ' + error.message); loadOrders() } else sel.className = 's-' + sel.value;
});
</script>
</body>
</html>
